services:
  - type: web
    name: job-automation-api
    runtime: docker
    plan: starter
    dockerfilePath: backend/api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-automation-db
          property: connectionString
      - key: SUPABASE_URL
        value: ${SUPABASE_URL}
      - key: SUPABASE_ANON_KEY
        value: ${SUPABASE_ANON_KEY}
      - key: LLM_API_KEY
        value: ${LLM_API_KEY}
      - key: LLM_BASE_URL
        value: ${LLM_BASE_URL}
      - key: LLM_MODEL
        value: ${LLM_MODEL}
      - key: CORS_ORIGINS
        value: https://frontend-pu7wehjxw-vaishvik1711s-projects.vercel.app

databases:
  - name: job-automation-db
    region: oregon
    postgresVersion: 16