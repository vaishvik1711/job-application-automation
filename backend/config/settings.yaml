# Job Automation System Configuration

application:
  daily_target: 25
  minimum: 20
  maximum: 30
  minimum_match_score: 75
  min_technical_score: 70
  min_soft_skills_score: 50

resume:
  preserve_format: true
  target_relevance: 0.85
  max_pages: 2

browser:
  headless: false
  human_intervention: true
  timeout: 30000
  slow_mo: 100

# Job Sources Configuration
# Each source can be enabled/disabled and configured independently
job_sources:
  # JobBank (Canada Government Job Bank) - public API, no auth required
  jobbank:
    enabled: true
    rate_limit: 1.0        # requests per second
    max_pages: 10          # max pages to scrape per search

  # Greenhouse ATS - used by many tech companies
  # Requires: base_url, api_key (and optionally board_token for public boards)
  greenhouse:
    enabled: false
    base_url: "https://api.greenhouse.io/v1"
    api_key: ""            # Set via environment variable GREENHOUSE_API_KEY
    board_token: ""        # Optional: for public board access
    rate_limit: 2.0        # requests per second
    max_pages: 10
    timeout: 30

  # Lever ATS - used by many startups and tech companies
  # Requires: base_url, api_key
  lever:
    enabled: false
    base_url: "https://api.lever.co/v1"
    api_key: ""            # Set via environment variable LEVER_API_KEY
    rate_limit: 2.0
    max_pages: 10
    timeout: 30

  # Workday ATS - used by large enterprises
  # Requires: base_url (company-specific), api_key, company_name
  workday:
    enabled: false
    base_url: ""           # e.g., "https://company.wd1.myworkdayjobs.com"
    api_key: ""            # Set via environment variable WORKDAY_API_KEY
    company_name: ""       # Company identifier in Workday
    auth_type: "basic"     # or "oauth"
    rate_limit: 1.0
    max_pages: 10
    timeout: 30

  # JobSpy - python-jobspy scraper for LinkedIn, Indeed, ZipRecruiter, Glassdoor, Google
  # No API keys required but subject to rate limiting
  jobspy:
    enabled: true
    # linkedin and indeed work; zip_recruiter (403) and glassdoor (400) blocked
    sites:
      - "linkedin"
      - "indeed"
    max_results_per_site: 25
    hours_old: 720  # 30 days
    linkedin_fetch_description: true
    country_indeed: "Canada"
    rate_limit: 0.5  # requests per second (be gentle)

  # iCIMS ATS - used by large enterprises
  # Requires: base_url, api_key (client_id:client_secret), customer_id
  icims:
    enabled: false
    base_url: ""           # e.g., "https://api.icims.com/customers/12345"
    api_key: ""            # Set via environment variable ICMS_API_KEY (format: client_id:client_secret)
    customer_id: ""        # iCIMS customer ID
    auth_type: "oauth"
    rate_limit: 1.0
    max_pages: 10
    timeout: 30

  # SmartRecruiters ATS - used by many companies
  # Requires: base_url, api_key, company_id (optional)
  smartrecruiters:
    enabled: false
    base_url: "https://api.smartrecruiters.com"
    api_key: ""            # Set via environment variable SMARTRECRUITERS_API_KEY
    company_id: ""         # Optional company identifier
    rate_limit: 2.0
    max_pages: 10
    timeout: 30

search:
  locations:
    - "Toronto, ON"
    - "Mississauga, ON"
    - "Brampton, ON"
    - "Kitchener, ON"
    - "Waterloo, ON"
    - "Cambridge, ON"
    - "Remote Canada"
  employment_types:
    - "Full-time"
  experience_levels:
    - "Entry Level"
    - "Associate"
    - "Mid-Senior Level"
  remote:
    - "Remote"
    - "Hybrid"
    - "On-site"

rate_limits:
  jobbank:
    requests_per_minute: 20
    delay_range: [1, 2]
  greenhouse:
    requests_per_minute: 100
    delay_range: [0.5, 1]
  lever:
    requests_per_minute: 100
    delay_range: [0.5, 1]
  workday:
    requests_per_minute: 50
    delay_range: [1, 2]
  icims:
    requests_per_minute: 50
    delay_range: [1, 2]
  smartrecruiters:
    requests_per_minute: 100
    delay_range: [0.5, 1]
  jobspy:
    requests_per_minute: 30
    delay_range: [2, 5]

llm:
  temperature: 0.1
  max_retries: 3
  timeout: 60
  max_tokens: 4000